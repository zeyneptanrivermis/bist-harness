<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIST research assistant</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--text:#1c1c1a;--text2:#57564f;--muted:#85847c;--line:#e7e5df;--accent:#1d4ed8;--ok:#166534;--warn:#92400e;--bad:#991b1b}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1e1e1c;--text:#ececea;--text2:#b0afa6;--muted:#85847c;--line:#323230;--accent:#8ab4ff;--ok:#86d69b;--warn:#f0b66b;--bad:#f1a1a1}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 20px 56px}
h1{font-size:20px;font-weight:600;margin:0}
.sub{font-size:13px;color:var(--muted);margin:2px 0 28px}
.lab{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.samples{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.samples button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text2);cursor:pointer}
.samples button:hover{border-color:var(--accent);color:var(--accent)}
textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;resize:vertical;min-height:96px}
textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 0}
.hint{font-size:12px;color:var(--muted)}
button.go{font:inherit;font-weight:500;padding:7px 20px;border:0;border-radius:8px;background:var(--text);color:var(--bg);cursor:pointer}
button.go:disabled{opacity:.5;cursor:wait}
.out{margin:32px 0 0;padding:24px 0 0;border-top:1px solid var(--line)}
.q{font-weight:600;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin:32px 0 0}
.top .lab{margin:0}
button.link{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:underline}
.status{font-size:13px;font-weight:600;letter-spacing:.02em;margin:0 0 8px}
.ans{white-space:pre-wrap;line-height:1.7;margin:0 0 24px}
.note{font-size:13px;color:var(--warn);border-left:3px solid var(--warn);padding:2px 0 2px 12px;margin:0 0 20px}
section{margin:0 0 24px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px ui-monospace,Menlo,monospace;padding:2px 8px;border:1px solid var(--line);border-radius:6px;color:var(--text2)}
.ev{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px;color:var(--text2);margin:0}
.ev dt{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.ev dd{margin:0}
.ev small{display:block;color:var(--muted)}
.ck{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px;color:var(--text2)}
.ok{color:var(--ok)}.no{color:var(--bad)}
details{font-size:13px;color:var(--text2)}
details pre{white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px}
button.trace{font:inherit;font-size:12px;padding:3px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text2);cursor:pointer}
button.trace:hover{border-color:var(--accent);color:var(--accent)}
dialog{width:min(820px,94vw);max-height:88vh;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.dh b{font-size:15px}
.db{padding:16px 20px 24px}
.db h3{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 14px;font-size:13px;color:var(--text2);margin:0}
.kv dt{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.kv dd{margin:0;word-break:break-all}
.step{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 8px;font-size:13px}
.step .t{font-weight:600;color:var(--text)}
.step .when{font:12px ui-monospace,Menlo,monospace;color:var(--muted);margin:0 0 4px}
.step details{margin:4px 0}
.err{color:var(--bad);font-size:14px;margin:16px 0 0}
.foot{font-size:12px;color:var(--muted);margin:40px 0 0}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>BIST research assistant</h1>
<p class="sub">Analysis date 10 Sep 2026 · local model, no cloud API</p>
<span class="lab">Examples</span>
<div class="samples" id="tabs"></div>
<label class="lab" for="q">Question</label>
<textarea id="q" placeholder="Ask about a BIST stock, a sector or a pattern"></textarea>
<div class="bar"><span class="hint">Ctrl or Cmd + Enter to send</span><button class="go" id="go">Ask</button></div>
<p class="err hide" id="err" role="alert"></p>
<div class="top hide" id="top"><span class="lab">History (this browser)</span><button class="link" id="clear">Clear</button></div>
<div id="log"></div>
<template id="tpl"><article class="out" aria-live="polite">
<p class="q"></p>
<p class="status"></p>
<p class="ans"></p>
<p class="note hide"></p>
<section><span class="lab">Tools called</span><div class="chips"></div></section>
<section><span class="lab">Evidence</span><dl class="ev"></dl></section>
<section class="ckbox"><span class="lab">Guard checks</span><div class="ck"></div></section>
<details class="hide"><summary>Model draft before the guard</summary><pre></pre></details>
<p><button class="trace hide" type="button">Run trace</button></p>
</article></template>
<dialog id="tr" aria-labelledby="trt"><div class="dh"><b id="trt">Run trace</b><button class="link" id="trx" type="button">Close</button></div><div class="db" id="trb"></div></dialog>
<p class="foot">Educational, evidence-bound summary. It is not investment advice.</p>
</main>
<script>
var $=function(id){return document.getElementById(id)};
var COLORS={INVESTIGATE:"warn",WATCH:"warn",REJECT_SIGNAL:"bad",ANALYSIS_UNSAFE:"bad",HARD_BLOCK:"bad",INVALID_TOOL_REQUEST:"bad",TECHNICAL_REVERSAL_CANDIDATE:"ok",POTENTIAL_CATCH_UP_CANDIDATE:"ok"};
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
var KEY="bist-chat-history",MAX=20,hist=[];
try{hist=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(x){}
function save(){var h=hist.slice();while(h.length){try{localStorage.setItem(KEY,JSON.stringify(h));return}catch(x){h.pop()}}} // traces are large: if the quota is hit, the oldest entries are not persisted
function pre(t){return el("pre","",typeof t==="string"?t:JSON.stringify(t,null,1))}
function det(title,body){var d=el("details"),s=el("summary","",title);d.appendChild(s);d.appendChild(pre(body));return d}
function kv(o){var l=el("dl","kv");Object.keys(o).forEach(function(k){var v=o[k];l.appendChild(el("dt","",k));l.appendChild(el("dd","",v&&typeof v==="object"?JSON.stringify(v):String(v)))});return l}
function sec(b,t){b.appendChild(el("h3","",t))}
function openTrace(p){
  var t=p.trace,b=$("trb");b.replaceChildren();
  sec(b,"Question");b.appendChild(el("p","",p.question));
  sec(b,"Model and decoding");b.appendChild(kv(t.model));
  sec(b,"Timestamps (UTC)");b.appendChild(kv({started_at:t.started_at,finished_at:t.finished_at,analysis_date:p.as_of_date}));
  sec(b,"Model calls ("+t.model_calls.length+")");
  t.model_calls.forEach(function(c,i){var s=el("div","step");s.appendChild(el("div","t",(i+1)+". "+c.step));s.appendChild(el("div","when",c.started_at+" → "+c.finished_at));
    c.messages.forEach(function(m){s.appendChild(det(m.role+" prompt",m.content))});s.appendChild(det("model output",c.output));b.appendChild(s)});
  sec(b,"Tool calls ("+t.tool_calls.length+")");
  t.tool_calls.forEach(function(c,i){var s=el("div","step");s.appendChild(el("div","t",(i+1)+". "+c.tool_name));s.appendChild(el("div","when",c.started_at+" → "+c.finished_at));
    s.appendChild(det("arguments",c.arguments));s.appendChild(det("output",c.output));b.appendChild(s)});
  sec(b,"Final answer");b.appendChild(el("p","t",p.status));b.appendChild(el("p","ans",p.answer));
  $("tr").showModal();
}
$("trx").onclick=function(){$("tr").close()};
$("tr").addEventListener("click",function(e){if(e.target===this)this.close()});
function render(p){
  var n=$("tpl").content.firstElementChild.cloneNode(true),q=function(c){return n.querySelector(c)};
  q(".q").textContent=p.question;
  var s=q(".status");s.textContent=p.status;s.style.color="var(--"+(COLORS[p.status]||"text2")+")";
  q(".ans").textContent=p.answer;
  if(p.guard_replaced){var note=q(".note");note.classList.remove("hide");note.textContent="The guard replaced the model draft with the deterministic summary ("+p.violations.join(", ")+").";}
  p.tools.forEach(function(t){q(".chips").appendChild(el("span","chip",t))});
  p.evidence.forEach(function(x){q(".ev").appendChild(el("dt","",x.id));var d=el("dd","",x.label);if(x.note)d.appendChild(el("small","",x.note));q(".ev").appendChild(d)});
  p.checks.forEach(function(x){q(".ck").appendChild(el("span",x.ok?"ok":"no",(x.ok?"✓ ":"✗ ")+x.label))});
  if(!p.checks.length)q(".ckbox").classList.add("hide");
  if(p.raw_answer){q("details").classList.remove("hide");q("pre").textContent=p.raw_answer}
  if(p.trace){var tb=q("button.trace");tb.classList.remove("hide");tb.onclick=function(){openTrace(p)}} // entries saved before traces existed have none
  return n;
}
function show(p){
  $("err").classList.add("hide");
  hist.unshift(p);hist=hist.slice(0,MAX);save();
  $("log").prepend(render(p));$("top").classList.remove("hide");
}
hist.forEach(function(p){$("log").appendChild(render(p))});
if(hist.length)$("top").classList.remove("hide");
$("clear").onclick=function(){hist=[];save();$("log").replaceChildren();$("top").classList.add("hide")};
function ask(){
  var q=$("q").value.trim();if(!q){$("q").focus();return}
  var go=$("go");go.disabled=true;go.textContent="Thinking…";$("err").classList.add("hide");
  fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})})
   .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Request failed");return j})})
   .then(show).catch(function(x){var m=$("err");m.textContent=x.message;m.classList.remove("hide")})
   .then(function(){go.disabled=false;go.textContent="Ask"});
}
$("go").onclick=ask;
$("q").addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();ask()}});
fetch("/api/samples").then(function(r){return r.json()}).then(function(list){
  list.forEach(function(s){var b=el("button","",s.name);b.onclick=function(){$("q").value=s.question;ask()};$("tabs").appendChild(b)});
});
</script>
</body>
</html>
